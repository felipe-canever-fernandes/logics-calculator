<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Logics Calculator</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="https://unpkg.com/mathlive?module"></script>
</head>

<body>
	<h1>Logics Calculator</h1>

	<main>
		<ol class="output" id="output"></ol>

		<div class="input">
			<math-field
				id="input-field"
				placeholder="\text{Enter a formula, e.g., } 0 \rightarrow 1"
			></math-field>

			<button id="input-button"><math-div>=</math-div></button>
		</div>
	</main>

	<script type="module" src="distribution/index.js"></script>
</body>

</html>
